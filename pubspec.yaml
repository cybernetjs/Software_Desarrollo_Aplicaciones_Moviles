name: sistema_tarea
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/ioc.yaml

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono/icono.png"
  min_sdk_android: 21